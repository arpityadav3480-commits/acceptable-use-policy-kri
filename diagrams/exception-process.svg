<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" font-family="Segoe UI, Arial, sans-serif">
  <title>Figure 2 — Exception request and approval process (KRI-ISP-001)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F5D8A"/>
    </marker>
  </defs>
  <style>
    .box { fill: #EEF3FA; stroke: #2F5D8A; stroke-width: 2; }
    .side { fill: #FFFFFF; stroke: #2F5D8A; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .line { stroke: #2F5D8A; stroke-width: 2; fill: none; }
    .t { fill: #1A2B3C; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .b { fill: #1A2B3C; font-size: 13px; text-anchor: middle; }
    .lt { fill: #1A2B3C; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .sl { fill: #1A2B3C; font-size: 12px; }
    .lab { fill: #2F5D8A; font-size: 13px; font-weight: 700; }
  </style>
  <rect width="1000" height="790" fill="#FFFFFF"/>

  <!-- 1 request -->
  <rect class="box" x="240" y="20" width="520" height="70" rx="10"/>
  <text class="t" x="500" y="46">1. Request submitted</text>
  <text class="b" x="500" y="70">Exception Request Form, sponsored by the line manager or PI</text>
  <line class="line" x1="500" y1="90" x2="500" y2="116" marker-end="url(#arrow)"/>

  <!-- 2 assessment -->
  <rect class="box" x="240" y="118" width="520" height="80" rx="10"/>
  <text class="t" x="500" y="143">2. ISL risk assessment</text>
  <text class="b" x="500" y="165">Likelihood × impact · consult the data owner</text>
  <text class="b" x="500" y="185">Decision within 10 working days (urgent: 2)</text>

  <!-- side: cannot be excepted -->
  <rect class="side" x="790" y="108" width="195" height="112" rx="8"/>
  <text class="sl" x="804" y="132" font-weight="700" font-size="13">Cannot be excepted:</text>
  <text class="sl" x="804" y="154">• legal or regulatory duties</text>
  <text class="sl" x="804" y="173">• contract and data-sharing</text>
  <text class="sl" x="816" y="190">obligations</text>
  <text class="sl" x="804" y="209">• ethics-approval conditions</text>

  <line class="line" x1="500" y1="198" x2="500" y2="224" marker-end="url(#arrow)"/>

  <!-- decision: risk -->
  <polygon points="500,226 610,271 500,316 390,271" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
  <text class="lt" x="500" y="276">Risk rating?</text>

  <polyline class="line" points="500,316 500,336"/>
  <polyline class="line" points="200,336 800,336"/>
  <line class="line" x1="200" y1="336" x2="200" y2="354" marker-end="url(#arrow)"/>
  <line class="line" x1="500" y1="336" x2="500" y2="354" marker-end="url(#arrow)"/>
  <line class="line" x1="800" y1="336" x2="800" y2="354" marker-end="url(#arrow)"/>

  <rect x="70" y="356" width="260" height="80" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2"/>
  <text class="lt" x="200" y="388">Low risk</text>
  <text class="b" x="200" y="412">Approved by the ISL</text>

  <rect x="370" y="356" width="260" height="80" rx="10" fill="#FFF8E1" stroke="#B7860B" stroke-width="2"/>
  <text class="lt" x="500" y="388">Medium risk</text>
  <text class="b" x="500" y="412">ISL + data owner / PI</text>

  <rect x="670" y="356" width="260" height="80" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
  <text class="lt" x="800" y="388">High risk or Restricted data</text>
  <text class="b" x="800" y="412">Executive Director (on ISL advice)</text>

  <polyline class="line" points="200,436 200,456"/>
  <polyline class="line" points="500,436 500,456"/>
  <polyline class="line" points="800,436 800,456"/>
  <polyline class="line" points="200,456 800,456"/>
  <line class="line" x1="500" y1="456" x2="500" y2="478" marker-end="url(#arrow)"/>

  <!-- decision: approved -->
  <polygon points="500,480 600,525 500,570 400,525" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/>
  <text class="lt" x="500" y="530">Approved?</text>

  <line class="line" x1="600" y1="525" x2="698" y2="525" marker-end="url(#arrow)"/>
  <text class="lab" x="636" y="516">No</text>
  <rect x="700" y="490" width="270" height="70" rx="10" fill="#F5F5F5" stroke="#6B6B6B" stroke-width="2"/>
  <text class="lt" x="835" y="518">Rejected</text>
  <text class="b" x="835" y="542">Comply with the policy or redesign</text>

  <line class="line" x1="500" y1="570" x2="500" y2="596" marker-end="url(#arrow)"/>
  <text class="lab" x="510" y="589">Yes</text>

  <!-- 3 active -->
  <rect class="box" x="200" y="598" width="600" height="86" rx="10"/>
  <text class="t" x="500" y="623">3. Exception active (maximum 12 months)</text>
  <text class="b" x="500" y="647">Recorded in the Exception Register · compensating controls in place</text>
  <text class="b" x="500" y="667">ISL reviews the register every quarter</text>
  <line class="line" x1="500" y1="684" x2="500" y2="706" marker-end="url(#arrow)"/>

  <!-- 4 expiry -->
  <rect class="box" x="240" y="708" width="520" height="60" rx="10"/>
  <text class="t" x="500" y="744">4. At expiry: renew after a fresh review, or close</text>
</svg>
